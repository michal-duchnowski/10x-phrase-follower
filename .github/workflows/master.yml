name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Check Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    needs: [format, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Deploy to DigitalOcean Droplet via Docker + GHCR
  deploy_digitalocean:
    name: Deploy to DigitalOcean Droplet
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            "build_env=PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_KEY=${{ secrets.PUBLIC_SUPABASE_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            NODE_ENV=production"

      - name: Prepare Compose configuration from this commit
        id: compose
        run: echo "content=$(base64 -w 0 docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          COMPOSE_FILE_BASE64: ${{ steps.compose.outputs.content }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DEEPSEEK_API_KEY,DEEPSEEK_MODEL,COMPOSE_FILE_BASE64
          script: |
            set -eu
            cd /opt/phrase-follower
            upsert_env() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                printf '\n%s=%s\n' "$1" "$2" >> .env
              fi
            }
            if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
              upsert_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
            fi
            if [ -n "${DEEPSEEK_MODEL:-}" ]; then
              upsert_env DEEPSEEK_MODEL "$DEEPSEEK_MODEL"
            fi
            # Update DOCKER_IMAGE in .env to use the branch-specific tag
            BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
            IMAGE_TAG="ghcr.io/${{ github.repository }}:${BRANCH_NAME}"
            echo "Deploying image: ${IMAGE_TAG}"
            # Update .env file with the branch-specific image tag
            if grep -q "^DOCKER_IMAGE=" .env; then
              sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=${IMAGE_TAG}|" .env
            else
              echo "DOCKER_IMAGE=${IMAGE_TAG}" >> .env
            fi
            # Validate and pull with this commit's Compose before replacing the live file.
            # Keep the server's .env and all uploaded files in place.
            COMPOSE_CANDIDATE=$(mktemp ./docker-compose.XXXXXX.yml)
            trap 'rm -f "$COMPOSE_CANDIDATE"' EXIT
            printf '%s' "$COMPOSE_FILE_BASE64" | base64 --decode > "$COMPOSE_CANDIDATE"
            docker compose --env-file .env -f "$COMPOSE_CANDIDATE" config --quiet
            docker compose --env-file .env -f "$COMPOSE_CANDIDATE" pull
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.yml.bak
            fi
            mv "$COMPOSE_CANDIDATE" docker-compose.yml
            docker compose up -d
            docker compose exec -T app node -e 'const fs = require("node:fs"); const dir = process.env.UPLOADS_DIR; if (!dir) throw new Error("UPLOADS_DIR is missing"); fs.accessSync(dir, fs.constants.W_OK); console.log("Image storage is writable:", dir);'
            docker compose ps
            # Keep the image used by the running container, but remove old
            # unreferenced images left behind by prior deployments.
            docker image prune -af
            echo "Deployment completed for branch: ${BRANCH_NAME}"

  # Cloudflare Pages deployment - disabled by default
  # Set ENABLE_CLOUDFLARE_DEPLOY=true in repository secrets to enable
  deploy_cloudflare_pages:
    name: Deploy to Cloudflare Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    env:
      # or keep your ASTRO_ADAPTER=cloudflare
      CF_PAGES: "1"
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_KEY: ${{ secrets.PUBLIC_SUPABASE_KEY }}
      # if you use server-side access:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Service role key for job processing and storage operations (bypasses RLS) - also needs to be set in Cloudflare Pages dashboard for runtime
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # TTS encryption key (64-character hex string) - also needs to be set in Cloudflare Pages dashboard for runtime
      PHRASE_TTS_ENCRYPTION_KEY: ${{ secrets.TTS_ENCRYPTION_KEY }}
    steps:
      - name: Check if Cloudflare deploy is enabled
        id: check_enabled
        run: |
          if [ "${{ secrets.ENABLE_CLOUDFLARE_DEPLOY }}" != "true" ]; then
            echo "Cloudflare deploy is disabled (ENABLE_CLOUDFLARE_DEPLOY != true)"
            exit 0
          fi
          echo "enabled=true" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.check_enabled.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check_enabled.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_enabled.outputs.enabled == 'true'
        run: npm ci

      - name: Build (Cloudflare adapter)
        if: steps.check_enabled.outputs.enabled == 'true'
        run: npm run build
        # CF_PAGES=1 already set at job level
        # or: ASTRO_ADAPTER=cloudflare npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.check_enabled.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=phrase-follower
